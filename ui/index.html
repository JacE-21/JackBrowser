<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toolbar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="tabs">
    <div id="tab-list"></div>
    <button id="new-tab" title="New tab (Ctrl+T)">+</button>
    <button id="new-private" title="New private tab (Ctrl+Shift+N)">&#128374;</button>
  </div>
  <form id="bar" autocomplete="off">
    <button type="button" id="back" title="Back (Alt+Left)">&#8592;</button>
    <button type="button" id="forward" title="Forward (Alt+Right)">&#8594;</button>
    <button type="button" id="reload" title="Reload (Ctrl+R)">&#8635;</button>
    <button type="button" id="home" title="Home">&#8962;</button>
    <input id="url" type="text" spellcheck="false" placeholder="Search or enter address">
    <button type="button" id="star" title="Bookmark this page (Ctrl+D)">&#9734;</button>
    <button type="button" id="shield" title="Ad blocker (applies to new tabs)">&#128737;</button>
    <button type="button" id="ext" title="Open extensions folder">&#129513;</button>
  </form>
  <div id="bookmarks"></div>
  <script src="app.js"></script>
</body>
</html>
